<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clockwork Live | background</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .stage { position: relative; width: 100%; height: 100vh; background: #000; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>
  <script type="module">
    const canvas = document.getElementById('canvas');
    const stage = document.getElementById('stage');

    // Only ever the Clockwork Live brand colours.
    const BRAND_COLOR_POOL = [
      '#3346ef', '#3dc4ff',
      '#ff2d4d', '#ff5a1f', '#ffb100',
      '#17e06a', '#0fd457', '#4ff28c',
    ];
    function randomColors(count) {
      const pool = [...BRAND_COLOR_POOL].sort(() => Math.random() - 0.5);
      return new Array(count).fill(0).map((_, i) => pool[i % pool.length]);
    }

    let app = null;
    try {
      const module = await import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js');
      const TubesCursor = module.default;
      app = TubesCursor(canvas, {
        tubes: { colors: randomColors(3), lights: { intensity: 200, colors: randomColors(4) } },
      });
    } catch (err) {
      console.error('Failed to load TubesCursor:', err);
    }

    const orbitStart = performance.now();
    const ORBIT_PERIOD_MS = 4600;
    function currentOrbitAngle(t) {
      const elapsed = t - orbitStart;
      const base = (elapsed / ORBIT_PERIOD_MS) * Math.PI * 2;
      const wobble = Math.sin(elapsed / 2600) * 0.18 + Math.sin(elapsed / 4300 + 1) * 0.1;
      return base + wobble - Math.PI / 2;
    }

    function dispatchSyntheticPointer(x, y) {
      const opts = { clientX: x, clientY: y, bubbles: true, cancelable: true, view: window };
      canvas.dispatchEvent(new PointerEvent('pointermove', opts));
      canvas.dispatchEvent(new MouseEvent('mousemove', opts));
      window.dispatchEvent(new PointerEvent('pointermove', opts));
      window.dispatchEvent(new MouseEvent('mousemove', opts));
    }

    function drive(t) {
      requestAnimationFrame(drive);
      if (!app) return;
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const R = Math.min(rect.width, rect.height) * 0.46;
      const angle = currentOrbitAngle(t || performance.now());
      const x = cx + Math.cos(angle) * R;
      const y = cy + Math.sin(angle) * R;
      dispatchSyntheticPointer(rect.left + x, rect.top + y);
    }
    requestAnimationFrame(drive);
  </script>
</body>
</html>
